apiVersion: v1
kind: Pod
metadata:
  name: demo-init-crashloopbackoff
  labels:
    demo: kwatch
spec:
  restartPolicy: Always
  initContainers:
    - name: wait-for-migration
      image: busybox:1.36
      command: ["sh", "-c", "echo 'ERROR: schema migration table not found' >&2; exit 1"]
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
